name: Deploy QRadar Rules

on:
  push:
    branches:
      - main
  workflow_dispatch: 
    paths:
      - 'rules/**.xml'
      - 'close_reasons/**.json'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Deploy rules to QRadar
        env:
          QRADAR_IP: ${{ secrets.QRADAR_IP }}
          QRADAR_TOKEN: ${{ secrets.QRADAR_TOKEN }}
        run: python scripts/import_rules.py
