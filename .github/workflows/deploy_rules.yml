name: Deploy QRadar Rules

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Deploy rules to QRadar
        env:
          QRADAR_IP: ${{ secrets.QRADAR_IP }}
          QRADAR_TOKEN: ${{ secrets.QRADAR_TOKEN }}
          GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
        run: python scripts/import_rules.py
